name: release

# A tag starts one coordinated release. Every preflight, package check, build,
# and native wheel test must pass before the publish job can touch either
# registry. A manual run performs the same validation without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable

      - name: verify synchronized package and documentation versions
        run: python scripts/sync-version.py --check

      - name: verify tag, changelog, main ancestry, and successful CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          release_sha="$(git rev-parse HEAD)"

          test "$tag_version" = "$package_version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          }
          grep -Eq "^## \\[${package_version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no dated [$package_version] release section"
            exit 1
          }

          git fetch --no-tags origin main
          test "$release_sha" = "$(git rev-parse origin/main)" || {
            echo "::error::release tag does not point to the current main commit"
            exit 1
          }

          ci_passed="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --commit "$release_sha" \
            --status completed \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")')"
          test "$ci_passed" = "true" || {
            echo "::error::the tagged commit has no successful completed CI workflow"
            exit 1
          }

  crate-package:
    name: crate package dry-run
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately no rust-cache: cargo publish builds under target/package,
      # whose transient contents make the cache action's post-step emit ENOENT.
      - run: cargo publish --locked --dry-run

  linux-wheels:
    name: wheel (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build native wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  windows-wheel:
    name: wheel (windows-x64)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          architecture: x64
      - name: build native wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist
          if-no-files-found: error

  macos-wheels:
    name: wheel (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build native wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    name: source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish:
    name: publish coordinated release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [crate-package, linux-wheels, windows-wheel, macos-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
      - name: publish wheels and sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
