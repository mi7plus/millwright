name: release

# A tag starts one coordinated release. Every preflight, package check, build,
# and native wheel test must pass before the publish job can touch either
# registry. A manual run performs the same validation without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: verify synchronized package and documentation versions
        run: python scripts/sync-version.py --check

      - name: verify tag, changelog, main ancestry, and successful CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          release_sha="$(git rev-parse HEAD)"

          test "$tag_version" = "$package_version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          }
          grep -Eq "^## \\[${package_version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no dated [$package_version] release section"
            exit 1
          }

          git fetch --no-tags origin main
          test "$release_sha" = "$(git rev-parse origin/main)" || {
            echo "::error::release tag does not point to the current main commit"
            exit 1
          }

          # The release helper pushes main and its tag together, so the tag
          # workflow commonly starts while that commit's CI is still running.
          # Wait up to 30 minutes, failing early only when CI has completed
          # without a successful run.
          for attempt in $(seq 1 90); do
            ci_state="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --commit "$release_sha" \
              --limit 10 \
              --json status,conclusion \
              --jq 'if any(.[]; .status == "completed" and .conclusion == "success") then "success" elif length == 0 or any(.[]; .status != "completed") then "pending" else "failed" end')"
            case "$ci_state" in
              success) break ;;
              failed)
                echo "::error::CI completed without a successful run for $release_sha"
                exit 1
                ;;
              pending)
                if [ "$attempt" -eq 90 ]; then
                  echo "::error::timed out waiting for CI on $release_sha"
                  exit 1
                fi
                echo "CI is not complete yet (attempt $attempt/90); waiting 20 seconds"
                sleep 20
                ;;
            esac
          done

  crate-package:
    name: crate package dry-run
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Deliberately no rust-cache: cargo publish builds under target/package,
      # whose transient contents make the cache action's post-step emit ENOENT.
      - run: cargo publish --locked --dry-run

  linux-wheels:
    name: wheel (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: build native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  windows-wheel:
    name: wheel (windows-x64)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          architecture: x64
      - name: build native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x64
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-x64
          path: dist
          if-no-files-found: error

  macos-wheels:
    name: wheel (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - name: macos-aarch64
            runner: macos-15
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: build native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: install and test the release wheel
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest -q tests/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    name: source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish:
    name: publish coordinated release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [crate-package, linux-wheels, windows-wheel, macos-wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: package crate artifact
        run: cargo package --locked --no-verify
      - name: check whether crate is already published
        id: crates-status
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/millwright/$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "millwright $version already exists on crates.io; publication will be skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: authenticate to crates.io
        if: steps.crates-status.outputs.exists != 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish crate to crates.io
        if: steps.crates-status.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
      - name: publish wheels and sdist to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate="target/package/millwright-$version.crate"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* "$crate" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* "$crate" \
              --verify-tag \
              --generate-notes \
              --title "Millwright $version" \
              --repo "$GITHUB_REPOSITORY"
          fi
